<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="Play engaging quizzes daily, compete in 1v1 battles, join weekly contests, and climb the leaderboard. Test your knowledge across multiple categories!" />
    <meta property="og:title" content="QuizMaster - Test Your Knowledge & Win Rewards" />
    <meta property="og:description" content="Join thousands of players in daily quizzes, 1v1 battles, and weekly contests. Earn coins, unlock achievements, and compete on the leaderboard!" />
    <meta property="og:type" content="website" />
    <title>Quexera - Mobile Quiz Challenge</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const root = document.documentElement;
          const storedTheme = localStorage.getItem('theme');
          const theme = storedTheme === 'dark' ? 'dark' : 'light';
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
